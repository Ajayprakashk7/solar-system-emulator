name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  validate:
    name: Validate (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'config/**', 'next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Scientific regression tests
        run: npm run test:science

      - name: Build project
        run: npm run build
        # Do not inject an empty secret: lib/env.ts intentionally falls back to
        # NASA's DEMO_KEY when NASA_API_KEY is undefined during CI builds.

      - name: Production smoke tests
        run: npm run test:smoke

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end tests
        run: npm run test:e2e

      - name: Validate portable production image
        run: docker build --tag solar-system-emulator:ci .
