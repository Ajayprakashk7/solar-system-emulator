name: One-time branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove temporary branches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Delete all non-main branches
        shell: bash
        run: printf 'DELETE\n' | bash scripts/cleanup-repository-branches.sh --apply
