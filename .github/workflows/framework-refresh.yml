name: Framework Refresh

on:
  push:
    branches: [hardening/production-2026-10-14]
    paths:
      - '.github/workflows/framework-refresh.yml'

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  refresh:
    name: Upgrade and validate framework
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v7
        with:
          ref: hardening/production-2026-10-14

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Upgrade Next and React stable lines
        run: |
          npm install --save-exact next@16.4.0 react@19.3.0 react-dom@19.3.0
          npm install --save-dev --save-exact eslint-config-next@16.4.0 @types/react@latest @types/react-dom@latest

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Migration lint scan
        run: |
          npm run lint -- --rule 'react-hooks/set-state-in-effect: off'

      - name: Type check
        run: npm run typecheck

      - name: Scientific regression tests
        run: npm run test:science

      - name: Build project
        run: npm run build

      - name: Production smoke tests
        run: npm run test:smoke

      - name: Commit generated lockfile refresh
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No framework dependency changes were generated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: upgrade Next.js 16.4 and React 19.3'
          git push origin HEAD:hardening/production-2026-10-14
