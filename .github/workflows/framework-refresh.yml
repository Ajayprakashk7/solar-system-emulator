name: Framework Refresh

on:
  push:
    branches: [hardening/production-2026-10-14]
    paths:
      - '.github/workflows/framework-refresh.yml'

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  refresh:
    name: Upgrade and validate framework
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v7
        with:
          ref: hardening/production-2026-10-14

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply Next 16 compatibility refactors
        run: |
          find app/api -name '*.ts' -print0 | xargs -0 sed -i 's#@/lib/error-handler#@/lib/app-error#g'
          python - <<'PY'
          from pathlib import Path
          path = Path('components/solar-system/ui/PlanetDetail.js')
          text = path.read_text()

          state_line = '  const [displayedPlanet, setDisplayedPlanet] = useState(selectedPlanet);'
          if state_line in text:
              text = text.replace(state_line, '  const displayedPlanet = selectedPlanet;', 1)

          start_marker = '  useEffect(() => {\n    if (!selectedPlanet) return;\n'
          end_marker = '  }, [selectedPlanet]);\n\n'
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start) + len(end_marker)
              text = text[:start] + text[end:]

          if 'setDisplayedPlanet(' in text:
              raise SystemExit('PlanetDetail still contains setDisplayedPlanet after migration')

          path.write_text(text)
          PY

      - name: Install current lockfile
        run: npm ci

      - name: Upgrade Next and React stable lines
        run: |
          npm install --save-exact next@16.4.0 react@19.3.0 react-dom@19.3.0
          npm install --save-dev --save-exact eslint-config-next@16.4.0 @types/react@latest @types/react-dom@latest

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run full project checks
        run: npm run check

      - name: Commit generated framework migration
        run: |
          if git diff --quiet; then
            echo 'No framework migration changes were generated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json app/api components/solar-system/ui/PlanetDetail.js
          git commit -m 'chore: upgrade Next.js 16.4 and React 19.3'
          git push origin HEAD:hardening/production-2026-10-14
