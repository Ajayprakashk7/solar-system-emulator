name: Playwright Refresh

on:
  push:
    branches: [hardening/e2e-nasa-client-2026-10-14]
    paths:
      - '.github/workflows/playwright-refresh.yml'

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  refresh:
    name: Install and validate Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: hardening/e2e-nasa-client-2026-10-14

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Add Playwright test dependency
        run: npm install --save-dev --save-exact @playwright/test@latest

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Run project checks
        run: npm run check

      - name: Run browser tests
        run: npm run test:e2e

      - name: Commit dependency lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency changes generated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'test: add Playwright browser regression suite'
          git push origin HEAD:hardening/e2e-nasa-client-2026-10-14
