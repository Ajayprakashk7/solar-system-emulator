name: Security Dependency Refresh

on:
  # Runs when this maintenance workflow is introduced or intentionally edited.
  # It does not run on normal application pushes.
  push:
    branches: [main]
    paths:
      - '.github/workflows/dependency-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: security-dependency-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh patched dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install current lockfile
        run: npm ci

      - name: Pin patched framework dependencies
        run: |
          npm install --save-exact \
            next@15.5.27 \
            react@19.1.9 \
            react-dom@19.1.9
          npm install --save-dev --save-exact \
            eslint-config-next@15.5.27 \
            postcss@8.5.30

      - name: Apply non-breaking npm security fixes
        run: npm audit fix

      - name: Validate lint
        run: npm run lint

      - name: Validate types
        run: npm run typecheck

      - name: Validate production build
        run: npm run build

      - name: Report remaining production dependency advisories
        run: npm audit --omit=dev || true

      - name: Commit refreshed manifest and lockfile
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- package.json package-lock.json; then
            echo 'Dependencies are already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: apply non-breaking dependency security fixes'
          git push origin HEAD:main
